name: Render and verify CANVAS artwork
on:
  workflow_dispatch:
  push:
    paths:
      - branding/canvas-master.png
      - scripts/render-icons.mjs
      - scripts/verify-brand.cjs
      - .github/workflows/render-icons.yml
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false sharp@0.33.5
      - run: node scripts/render-icons.mjs
      - run: git diff --exit-code -- safari-canvas-180-20261007j.png safari-canvas-192-20261007j.png 1_App/img/zeroone_icon.svg 1_App/img/zeroone_icon.png 1_App/img/zeroone_icon_180.png 1_App/img/zeroone_icon_192.png 1_App/img/zeroone_icon_512.png
  verify-production:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-brand.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: production-brand-screenshots
          path: production-*.png
