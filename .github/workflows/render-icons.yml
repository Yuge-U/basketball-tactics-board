name: Render ZERO ONE Canvas icons
on:
  workflow_dispatch:
  push:
    paths:
      - 1_App/img/zeroone_icon.svg
      - scripts/render-icons.mjs
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install sharp@0.33.5
      - run: node scripts/render-icons.mjs
      - name: Commit rendered icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 1_App/img/zeroone_icon.png 1_App/img/zeroone_icon_180.png 1_App/img/zeroone_icon_192.png 1_App/img/zeroone_icon_512.png
          git diff --cached --quiet || git commit -m "Render ZERO ONE Canvas icons"
          git push
