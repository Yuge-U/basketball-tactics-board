name: ZERO ONE isolated storage probe
on:
  push:
    branches: ['lab/practice-browser-v03']
    paths: ['practice-lab-probe/**', '.github/workflows/practice-storage-probe.yml']
permissions:
  contents: read
concurrency:
  group: zero-one-storage-probe-fixed
  cancel-in-progress: true
jobs:
  storage-probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Prepare only the verified SQLite required by these tests
        run: |
          python3 - <<'PY'
          import hashlib, io, pathlib, urllib.request, zipfile # 公式配布をハッシュ検証して扱います。
          root = pathlib.Path('practice-lab-probe/site') # CI専用の配置先を指定します。
          root.mkdir(parents=True, exist_ok=True) # 配信フォルダを準備します。
          data = urllib.request.urlopen('https://sqlite.org/2026/sqlite-wasm-3530400.zip', timeout=60).read() # この試験で実際に使うSQLiteだけを取得します。
          expected = 'e4fa7e1750b42f6954115d8e69ffff7dc08da7e9fee6e28a2a0ea6bf228a49f2' # 固定した公式検査値です。
          assert hashlib.sha3_256(data).hexdigest() == expected, 'SQLite archive hash mismatch' # 不一致は中断します。
          archive = zipfile.ZipFile(io.BytesIO(data)) # 検査済みZIPを読みます。
          for name in ['sqlite3.js', 'sqlite3.wasm']: # 必要な実行部品を取り出します。
              matches = [path for path in archive.namelist() if path.endswith('/' + name) or path == name] # ファイルを一意に探します。
              assert len(matches) == 1, 'Ambiguous archive member' # 別ファイルへの置換を拒否します。
              (root / name).write_bytes(archive.read(matches[0])) # CIへ部品を保存します。
          print('SQLite archive verified', expected) # 検査結果をログへ残します。
          PY
      - name: Install current fixed browser test runner
        run: |
          npm install --no-save --ignore-scripts playwright@1.63.0
          npx playwright install --with-deps chromium webkit
      - name: Preserve independent root-cause diagnostics including known upstream failures
        run: node practice-lab-probe/webkit-diagnostic.mjs
      - name: Run isolated browser storage acceptance checks
        run: node practice-lab-probe/browser-storage-fixed.mjs
      - name: Preserve all results and reproducible test sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-one-storage-fixed-${{ matrix.os }}
          retention-days: 7
          path: |
            practice-lab-probe/results/
            practice-lab-probe/site/
            practice-lab-probe/fixed-site/
            practice-lab-probe/*.mjs
          if-no-files-found: error
